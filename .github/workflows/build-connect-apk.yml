name: Build CONNECT APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode and extract source
        run: |
          base64 --decode CONNECT-Android-Source-Base64.txt > source.zip
          unzip -t source.zip
          unzip -o source.zip

      - name: Build APK
        run: |
          cd CONNECT
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: CONNECT-APK
          path: CONNECT/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
